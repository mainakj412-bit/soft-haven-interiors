# Netlify build configuration.
# This file wins over anything set in the Netlify dashboard, so the deploy
# settings live in version control instead of in a web form someone has to
# remember to check.

[build]
  # Serve only the built site. Without this Netlify publishes the repo root,
  # which exposes _page.src.html and the _scripts/ folder to the public.
  publish = "docs"

  # No build step: the site is plain HTML, already generated by _scripts/build.ps1.
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Photos and logos are content-stable and get replaced by name, so let browsers
# hold on to them.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
